  <script>
    (function() {
      var pathname = window.location.pathname;
      var search = window.location.search || '';
      var hash = window.location.hash || '';

      // Determine base path (supports subpath hosting on GitHub Pages and root domain)
      var repoBase = '/';
      var subPath = pathname;
      if (pathname.indexOf('/sahih-muslim') === 0) {
        repoBase = '/sahih-muslim/';
        subPath = pathname.slice('/sahih-muslim'.length);
      }
      subPath = subPath.replace(/^\/+|\/+$/g, '');

      var targetHash = '';

      if (subPath) {
        // 1. Direct Hadith Number: {number} or hadith/{number} or h/{number}
        var hadithMatch = subPath.match(/^(?:hadith\/|h\/)?(\d+(?:\.\d+)?)$/i);
        if (hadithMatch && hadithMatch[1] !== '404') {
          targetHash = '#hadith/' + hadithMatch[1];
        } else {
          // 2. Book coordinate: book/{book_num} or book/{book_num}/{in_book}
          var bookMatch = subPath.match(/^book\/(\d+)(?:\/(\d+))?$/i);
          if (bookMatch) {
            targetHash = bookMatch[2] 
              ? '#book/' + bookMatch[1] + '/' + bookMatch[2] 
              : '#book/' + bookMatch[1];
          } else if (hash) {
            targetHash = hash;
          }
        }
      } else if (hash) {
        targetHash = hash;
      }

      var destination = repoBase + (targetHash || '');
      if (search && destination.indexOf('?') === -1) {
        destination += search;
      }

      window.location.replace(destination);
    })();
  </script>
</head>
